services:
  - type: web
    name: fintech-regulatory-backend
    env: node
    region: oregon
    plan: starter
    autoDeploy: true
    buildCommand: npm ci && npm run build:prod
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      # Application
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.20.0"
      - key: PORT
        value: "4000"
      - key: LOG_LEVEL
        value: info

      # URLs (set in Render dashboard)
      # FRONTEND_URL supports a comma-separated list for multiple origins.
      # APP_URL is this Render service URL.
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false

      # Database
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # Upstash Redis
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # Supabase Auth
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

      # Email (Resend)
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false

      # AI (Anthropic Claude)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6

      # Vector Database (Pinecone)
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_ENVIRONMENT
        value: us-east-1-aws
      - key: PINECONE_INDEX_NAME
        value: sheriabot-legal-corpus

      # File Storage (Cloudflare R2)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: sheriabot-documents
      - key: R2_PUBLIC_URL
        sync: false

      # File Storage (Cloudflare R2) - public bucket (avatars, logos, branding)
      - key: R2_PUBLIC_ACCESS_KEY_ID
        sync: false
      - key: R2_PUBLIC_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_BUCKET_URL
        sync: false

      # n8n Automation Integration (approval gate, webhook fan-out)
      - key: AUTOMATION_HMAC_SECRET
        sync: false
      - key: APPROVAL_DECISION_LINK_SECRET
        sync: false
      - key: SHERIABOT_WEBHOOK_INGRESS_SECRET
        sync: false

      # Stripe Billing
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Marketing & Outreach Module
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: MARKETING_TOKEN_HMAC_SECRET
        sync: false
      - key: APP_PUBLIC_URL
        sync: false

      # Rate Limiting
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: RATE_LIMIT_WINDOW
        value: 15m

      # Admin Seed (optional, used by seed script)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Vault Reconciliation Cron
      - key: VAULT_RECONCILIATION_DRY_RUN
        value: "true"
